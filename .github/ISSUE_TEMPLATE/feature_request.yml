name: 💡 Feature Request
description: Suggest an idea or enhancement for Synapse
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome ideas that enhance reading ergonomics, content extraction, offline resilience, and data ownership!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions or context
      description: Any alternative solutions or features you've considered.
