<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Synapse Glow / Neural Gradient -->
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.8" />

  <!-- Subtle Neural Grid / Ambient Nodes -->
  <g opacity="0.25">
    <circle cx="120" cy="140" r="3" fill="#38bdf8" />
    <circle cx="390" cy="130" r="3.5" fill="#6366f1" />
    <circle cx="100" cy="380" r="3" fill="#8b5cf6" />
    <circle cx="410" cy="370" r="3" fill="#38bdf8" />
    <line x1="120" y1="140" x2="200" y2="180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="390" y1="130" x2="330" y2="200" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="100" y1="380" x2="190" y2="340" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="410" y1="370" x2="310" y2="330" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- Primary Synapse "S" Helix Path -->
  <!-- Top Hook -->
  <path
    d="M 330 150 C 330 110, 200 100, 180 160 C 160 220, 350 240, 330 350 C 310 420, 170 410, 170 360"
    fill="none"
    stroke="url(#neuralGrad)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Inner Core Accent Path for Crisp Sharpness -->
  <path
    d="M 330 150 C 330 110, 200 100, 180 160 C 160 220, 350 240, 330 350 C 310 420, 170 410, 170 360"
    fill="none"
    stroke="#ffffff"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Synaptic Dendrite Nodes with Halos -->
  <!-- Node 1: Top Right Input -->
  <g filter="url(#subtleGlow)">
    <circle cx="330" cy="150" r="22" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6" />
    <circle cx="330" cy="150" r="10" fill="#38bdf8" />
  </g>

  <!-- Node 2: Center Processing Junction -->
  <g filter="url(#subtleGlow)">
    <circle cx="256" cy="256" r="26" fill="#0f172a" stroke="url(#neuralGrad)" stroke-width="7" />
    <circle cx="256" cy="256" r="12" fill="#60a5fa" />
    <circle cx="256" cy="256" r="5" fill="#ffffff" />
  </g>

  <!-- Node 3: Bottom Left Output -->
  <g filter="url(#subtleGlow)">
    <circle cx="170" cy="360" r="22" fill="#0f172a" stroke="#8b5cf6" stroke-width="6" />
    <circle cx="170" cy="360" r="10" fill="#a78bfa" />
  </g>

  <!-- Cross-Synaptic Signal Sparks -->
  <circle cx="210" cy="180" r="6" fill="#22d3ee" filter="url(#subtleGlow)" />
  <circle cx="300" cy="325" r="6" fill="#818cf8" filter="url(#subtleGlow)" />
</svg>
